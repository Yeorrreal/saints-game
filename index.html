<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성인 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Noto+Serif+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --ink:    #1a1410;
  --paper:  #f5edd8;
  --muted:  rgba(26,20,16,.5);
  --accent: #8b2319;
  --gold:   #c8901a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; overflow: hidden;
  font-family: 'Pretendard Variable', Pretendard, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* shared bg */
.gold-bg {
  background-image: url('./Assets/gold-texture.jpg');
  background-size: cover;
  background-position: center;
}

/* ══════════════════════════════
   TITLE SCREEN
══════════════════════════════ */
#screen-title {
  display: none;
  position: fixed; inset: 0; z-index: 50;
  align-items: center; justify-content: center;
  flex-direction: column;
  overflow: hidden;
  background: #0d0906;
}
#screen-title.active { display: flex; }

.title-ghost {
  position: absolute; right: 3%; bottom: 0;
  height: 90vh; opacity: .1;
  pointer-events: none; user-select: none;
  animation: ghost-sway 9s ease-in-out infinite;
}
@keyframes ghost-sway {
  0%,100% { transform: translateX(0); }
  50%      { transform: translateX(8px); }
}

/* painting mosaic behind title card */
.title-paintings {
  position: absolute; inset: 0; z-index: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 1fr);
}
.title-paintings img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  filter: brightness(.22) saturate(.5) sepia(.55);
}
.title-paintings-vignette {
  position: absolute; inset: 0; z-index: 1;
  background:
    radial-gradient(ellipse 65% 75% at 50% 48%,
      rgba(13,9,4,.15) 0%, rgba(8,4,1,.9) 100%);
  pointer-events: none;
}

.title-float {
  position: absolute;
  pointer-events: none; user-select: none;
  opacity: 0; animation: float-in .7s ease forwards;
}
@keyframes float-in {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: var(--op,.08); transform: translateY(0); }
}

.title-inner {
  position: relative; z-index: 2;
  text-align: center;
  display: flex; flex-direction: column; align-items: center;
  gap: 0;
  /* frosted card */
  background: rgba(20,15,10,.45);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(220,180,60,.25);
  border-radius: 6px;
  padding: 48px 64px 40px;
  max-width: 720px;
}
.title-badge {
  font-size: 10px; letter-spacing: .22em; font-weight: 700;
  color: rgba(220,180,80,.7); text-transform: uppercase;
  margin-bottom: 20px;
  opacity: 0; animation: fade-up .6s .1s ease forwards;
}
.title-h1 {
  font-family: 'Noto Serif KR', serif;
  font-size: clamp(60px, 9vw, 96px);
  font-weight: 700; line-height: 1;
  color: #f5edd8; letter-spacing: -.02em;
  white-space: nowrap;
  opacity: 0; animation: fade-up .6s .2s ease forwards;
}
.title-rule {
  width: 80px; height: 1px;
  background: rgba(220,180,60,.4);
  margin: 20px 0;
  opacity: 0; animation: fade-up .6s .3s ease forwards;
}
.title-sub {
  font-family: 'IM Fell English', serif;
  font-style: italic; font-size: 17px;
  color: rgba(245,237,216,.55);
  opacity: 0; animation: fade-up .6s .35s ease forwards;
}
.title-desc {
  font-size: 13px; color: rgba(245,237,216,.5);
  line-height: 1.8; margin-top: 10px;
  opacity: 0; animation: fade-up .6s .4s ease forwards;
}
.title-start {
  margin-top: 36px;
  padding: 14px 52px;
  background: rgba(220,160,30,.9); color: var(--ink);
  border: none; border-radius: 3px;
  font-family: inherit; font-size: 14px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
  cursor: pointer;
  transition: background .2s, transform .15s;
  opacity: 0; animation: fade-up .6s .5s ease forwards;
}
.title-start:hover { background: rgba(200,130,20,1); transform: translateY(-2px); }
.title-credit {
  margin-top: 16px; font-size: 11px; letter-spacing: .1em;
  color: rgba(245,237,216,.2); text-transform: uppercase;
  opacity: 0; animation: fade-up .6s .6s ease forwards;
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ══════════════════════════════
   GAME SCREEN
══════════════════════════════ */
#screen-game {
  display: none;
  position: fixed; inset: 0;
}
#screen-game.active { display: block; }
/* dark tint over gold texture */
#screen-game::before {
  content: '';
  position: absolute; inset: 0;
  background: rgba(8,4,1,.82);
  z-index: 0; pointer-events: none;
}

.game-canvas {
  position: relative; z-index: 1;
  width: 100vw; height: 100vh;
  display: grid;
  grid-template-columns: 21% 1fr 268px;
  grid-template-rows: auto 1fr;
}

/* ── HUD row ── */
.hud {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 20px;
  background: rgba(20,15,10,.5);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(220,180,60,.2);
  z-index: 20;
}
.hud-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px; font-weight: 700;
  color: #f5edd8; letter-spacing: -.01em;
}
.hud-sep { width: 1px; height: 14px; background: rgba(245,237,216,.2); }
.hud-count {
  font-size: 12px; font-weight: 600; color: rgba(245,237,216,.7);
  letter-spacing: .06em;
}
.hud-btn {
  appearance: none; border: 1px solid rgba(245,237,216,.25);
  background: transparent; color: rgba(245,237,216,.75);
  padding: 5px 14px; border-radius: 20px;
  font-family: inherit; font-size: 11px; font-weight: 600;
  cursor: pointer; letter-spacing: .05em;
  transition: background .15s, border-color .15s;
}
.hud-btn:hover { background: rgba(245,237,216,.12); border-color: rgba(245,237,216,.5); }

/* ── LEFT: Mannequin zone ── */
.mannequin-zone {
  grid-column: 1; grid-row: 2;
  position: relative;
  overflow: hidden;
}
.stage {
  position: absolute;
  width: 376px;
  background: transparent; border: none;
  transform-origin: top left;
}
.mannequin-zone.drop-over::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 80% at 50% 40%,
    rgba(220,180,60,.2) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
.mannequin-base {
  position: absolute; top: 100px; left: 0;
  width: 100%; height: 971px;
  object-fit: contain;
  pointer-events: none; user-select: none;
  -webkit-user-drag: none;
}

/* placed layers */
.placed-layer {
  position: absolute; user-select: none;
}
.placed-layer img {
  display: block; pointer-events: none;
  -webkit-user-drag: none; user-select: none;
}
/* in normal mode: hover shows remove cursor */
.placed-layer:not(.dev-draggable) {
  cursor: pointer;
}
.placed-layer:not(.dev-draggable):hover img {
  filter: brightness(1.15) saturate(1.2) drop-shadow(0 0 8px rgba(220,180,60,.5));
}
.placed-layer.just-placed { animation: place-burst .45s ease-out; }
@keyframes place-burst {
  0%   { filter: brightness(1.8) saturate(1.5); }
  100% { filter: brightness(1) saturate(1); }
}
.placed-layer.dev-draggable { cursor: move; outline: 1px dashed rgba(220,180,60,.6); }

/* ── CENTER: Scatter zone ── */
.items-zone {
  grid-column: 2; grid-row: 2;
  position: relative;
}

.scatter-item {
  position: absolute;
  cursor: grab; user-select: none;
  transition: transform .2s cubic-bezier(.22,1,.36,1),
              filter .2s, opacity .3s;
}
.scatter-item:hover {
  z-index: 15;
  transform: translateY(-6px) scale(1.08) !important;
  filter: drop-shadow(0 14px 28px rgba(0,0,0,.35)) !important;
}
.scatter-item:active { cursor: grabbing; }
.scatter-item img {
  display: block; max-width: 100%;
  pointer-events: none; user-select: none;
  -webkit-user-drag: none;
}
.scatter-item.placed {
  opacity: .16; filter: grayscale(.5) !important;
  transform: none !important; cursor: pointer;
}
.scatter-item.placed:hover {
  opacity: .28 !important; transform: none !important;
}

/* hover tooltip */
.item-tooltip {
  position: absolute;
  bottom: calc(100% + 7px); left: 50%;
  transform: translateX(-50%);
  background: rgba(20,15,10,.88);
  color: #f5edd8;
  padding: 4px 11px; border-radius: 4px;
  font-size: 11px; font-weight: 600; letter-spacing: .03em;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity .12s;
  z-index: 20;
  border: 1px solid rgba(220,180,60,.25);
}
.scatter-item:hover .item-tooltip { opacity: 1; }
/* items near top: tooltip opens downward to avoid HUD collision */
.scatter-item.tooltip-down .item-tooltip {
  bottom: auto;
  top: calc(100% + 7px);
}

/* ── RIGHT: Saints panel ── */
.saints-panel {
  grid-column: 3; grid-row: 2;
  background: rgba(15,11,7,.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-left: 1px solid rgba(220,180,60,.2);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.saints-panel-header {
  padding: 16px 18px 10px;
  font-family: 'Noto Serif KR', serif;
  font-size: 13px; font-weight: 700;
  color: rgba(245,237,216,.5);
  letter-spacing: .12em; text-transform: uppercase;
  border-bottom: 1px solid rgba(220,180,60,.15);
  flex-shrink: 0;
}
.saints-panel-progress {
  padding: 10px 18px;
  font-size: 11px; color: rgba(245,237,216,.35);
  letter-spacing: .06em;
  border-bottom: 1px solid rgba(220,180,60,.12);
  flex-shrink: 0;
}
.saints-panel-progress span {
  color: rgba(220,180,60,.8); font-weight: 700;
}
.saints-list {
  flex: 1; overflow-y: auto;
  padding: 8px 0;
}
.saints-list::-webkit-scrollbar { width: 3px; }
.saints-list::-webkit-scrollbar-track { background: transparent; }
.saints-list::-webkit-scrollbar-thumb { background: rgba(220,180,60,.3); border-radius: 2px; }

/* each saint card */
.saint-card {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px;
  border-bottom: 1px solid rgba(220,180,60,.08);
  transition: background .2s;
  cursor: default;
}
.saint-card.discovered { cursor: pointer; }
.saint-card.discovered:hover { background: rgba(220,180,60,.08); }

.saint-card-img {
  width: 48px; height: 80px; flex-shrink: 0;
  border-radius: 3px; overflow: hidden;
  border: 1px solid rgba(220,180,60,.15);
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.2);
}
.saint-card-img img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: top;
  display: block;
  pointer-events: none; user-select: none;
  transition: filter .5s;
}
.saint-card.undiscovered .saint-card-img img {
  filter: grayscale(1) brightness(.15) contrast(1.1);
}
.saint-card.discovered .saint-card-img img {
  filter: none;
}
.saint-card.just-found .saint-card-img img {
  animation: card-reveal .6s ease-out;
}
@keyframes card-reveal {
  0%   { filter: brightness(2.5) saturate(2); }
  100% { filter: none; }
}

.saint-card-info { flex: 1; min-width: 0; }
.saint-card-name {
  font-size: 13px; font-weight: 700;
  color: rgba(245,237,216,.9);
  letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.saint-card.undiscovered .saint-card-name {
  color: rgba(245,237,216,.28);
  letter-spacing: .12em; font-weight: 400;
}
.saint-card-latin {
  font-family: 'IM Fell English', serif;
  font-style: italic; font-size: 11px;
  color: rgba(220,180,60,.55);
  margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.saint-card-attrs {
  margin-top: 5px;
  display: flex; flex-wrap: wrap; gap: 3px;
}
.saint-card-chip {
  background: rgba(220,180,60,.12);
  border: 1px solid rgba(220,180,60,.2);
  border-radius: 10px; padding: 2px 7px;
  font-size: 9.5px; color: rgba(245,237,216,.45);
}

/* glow on discovered card */
.saint-card.discovered {
  animation: saint-appear .4s ease both;
}
@keyframes saint-appear {
  from { opacity: 0; transform: translateX(6px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ══════════════════════════════
   DISCOVERY MODAL
══════════════════════════════ */
.modal-back {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(15,11,7,.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}
.modal-back.open { display: flex; }
.modal {
  background: var(--paper);
  border-radius: 16px; padding: 36px;
  max-width: 540px; width: 100%;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 40px 90px rgba(0,0,0,.5);
  animation: modal-pop .38s cubic-bezier(.22,1,.36,1);
}
@keyframes modal-pop {
  from { opacity: 0; transform: scale(.88) translateY(16px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-eyebrow {
  font-size: 10px; letter-spacing: .22em; color: var(--gold);
  font-weight: 700; text-transform: uppercase; margin-bottom: 8px;
}
.modal-name {
  font-family: 'Noto Serif KR', serif;
  font-size: 30px; font-weight: 700;
  line-height: 1.2; margin-bottom: 4px; color: var(--ink);
}
.modal-latin {
  font-family: 'IM Fell English', serif;
  font-style: italic; font-size: 14px;
  color: #7a6a52; margin-bottom: 22px;
}
.modal-body {
  display: grid; grid-template-columns: 148px 1fr;
  gap: 20px; align-items: start;
}
.modal-img-box {
  background: #ede4cf; border: 1px solid #d5c9b0;
  border-radius: 8px; padding: 10px;
  display: flex; align-items: center; justify-content: center;
}
.modal-img-box img { max-width: 100%; max-height: 200px; }
.modal-text { font-size: 13.5px; line-height: 1.75; color: var(--ink); }
.modal-label {
  font-size: 9.5px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: #7a6a52;
  margin-bottom: 6px; margin-top: 14px;
}
.modal-label:first-child { margin-top: 0; }
.modal-attrs { display: flex; flex-wrap: wrap; gap: 5px; }
.modal-chip {
  background: #ede4cf; border: 1px solid #d5c9b0;
  border-radius: 20px; padding: 3px 10px;
  font-size: 11.5px; color: #7a6a52;
}
.modal-story { margin: 0; }
.modal-footer { margin-top: 28px; display: flex; justify-content: flex-end; }
.modal-btn {
  appearance: none; border: none;
  background: var(--ink); color: var(--paper);
  padding: 10px 28px; border-radius: 6px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; letter-spacing: .04em; transition: background .2s;
}
.modal-btn:hover { background: var(--accent); }

/* ══════════════════════════════
   COMPLETION SCREEN
══════════════════════════════ */
#screen-complete {
  position: fixed; inset: 0; z-index: 300;
  display: none; align-items: center; justify-content: center;
  background: rgba(6,3,1,.9);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
}
#screen-complete.open { display: flex; }

.complete-particles {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
}
.complete-particle {
  position: absolute; border-radius: 50%;
  background: rgba(220,180,60,.75);
  animation: cp-rise var(--dur,3s) var(--del,0s) ease-out infinite;
}
@keyframes cp-rise {
  0%   { transform: translateY(0) rotate(0deg) scale(1); opacity:.8; }
  100% { transform: translateY(-110vh) rotate(360deg) scale(.2); opacity:0; }
}

.complete-inner {
  position: relative; z-index: 1;
  text-align: center;
  padding: 56px 72px 48px;
  background: rgba(22,15,8,.6);
  border: 1px solid rgba(220,180,60,.35);
  border-radius: 8px;
  box-shadow: 0 0 80px rgba(220,160,30,.12), inset 0 0 40px rgba(220,160,30,.04);
  max-width: 580px; width: 90%;
  animation: modal-pop .55s cubic-bezier(.22,1,.36,1);
}
.complete-halo {
  font-size: 42px; margin-bottom: 18px;
  filter: drop-shadow(0 0 12px rgba(220,180,60,.6));
}
.complete-eyebrow {
  font-family: 'IM Fell English', serif;
  font-style: italic; font-size: 13px;
  color: rgba(220,180,60,.65); letter-spacing: .18em;
  margin-bottom: 18px;
}
.complete-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 34px; font-weight: 700; line-height: 1.3;
  color: #f5edd8; margin-bottom: 6px;
}
.complete-rule {
  width: 72px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(220,180,60,.5), transparent);
  margin: 18px auto 16px;
}
.complete-sub {
  font-size: 13px; color: rgba(245,237,216,.45);
  letter-spacing: .04em; margin-bottom: 24px;
}
.complete-grid {
  display: flex; flex-wrap: wrap; gap: 7px;
  justify-content: center; margin-bottom: 36px;
}
.complete-chip {
  background: rgba(220,180,60,.1);
  border: 1px solid rgba(220,180,60,.22);
  border-radius: 20px; padding: 5px 14px;
  font-family: 'Noto Serif KR', serif;
  font-size: 11.5px; color: rgba(245,237,216,.75);
}
.complete-actions { display: flex; gap: 12px; justify-content: center; }
.complete-btn {
  appearance: none; border: none;
  background: rgba(220,160,30,.9); color: #1a1410;
  padding: 12px 40px; border-radius: 3px;
  font-family: inherit; font-size: 13px; font-weight: 700;
  cursor: pointer; letter-spacing: .08em;
  transition: background .2s, transform .15s;
}
.complete-btn:hover { background: rgba(200,130,20,1); transform: translateY(-2px); }
.complete-btn-ghost {
  appearance: none;
  background: transparent; color: rgba(245,237,216,.5);
  border: 1px solid rgba(245,237,216,.2);
  padding: 12px 28px; border-radius: 3px;
  font-family: inherit; font-size: 13px;
  cursor: pointer; letter-spacing: .04em;
  transition: border-color .2s, color .2s;
}
.complete-btn-ghost:hover { border-color: rgba(245,237,216,.5); color: rgba(245,237,216,.9); }

/* ── Dev HUD ── */
.dev-hud {
  position: fixed; bottom: 16px; right: 16px;
  background: #1a1410; color: #f5edd8;
  padding: 12px 16px; border-radius: 10px;
  font-family: 'SF Mono', monospace; font-size: 11px;
  line-height: 1.65; max-width: 320px; z-index: 50; display: none;
}
.dev-hud.open { display: block; }
.dev-hud strong { color: #e8c96a; }
.dev-hud kbd { background: rgba(255,255,255,.14); padding: 1px 5px; border-radius: 3px; font-size: 10px; }

/* ══════════════════════════════════════
   MOBILE — saints panel as overlay drawer,
   items as wrap grid, mannequin on top
   ══════════════════════════════════════ */

/* hidden by default — only appears on mobile */
.hud-btn-saints { display: none; }
.saints-close   { display: none; }

/* backdrop for drawer */
.saints-backdrop {
  position: fixed; inset: 0;
  background: rgba(8,4,1,.55);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  z-index: 90;
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease;
}
.saints-backdrop.open {
  opacity: 1; pointer-events: auto;
}

@media (max-width: 900px) {
  /* HUD: hide title + separators, compact buttons */
  .hud-title, .hud-sep { display: none; }
  .hud { padding: 8px 10px; gap: 6px; flex-wrap: wrap; }
  .hud-btn {
    padding: 5px 10px; font-size: 10.5px; letter-spacing: .03em;
  }
  .hud-count {
    font-size: 11px; padding: 4px 8px;
    background: rgba(245,237,216,.06);
    border-radius: 12px; flex-shrink: 0;
  }
  .hud-btn-saints {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: auto;
    background: rgba(220,180,60,.18);
    border-color: rgba(220,180,60,.55);
    color: #f5edd8;
  }
  .hud-btn-saints:hover {
    background: rgba(220,180,60,.28);
  }

  /* Canvas: single column. HUD | mannequin (large) | items (wrap) */
  .game-canvas {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
  }
  .mannequin-zone {
    grid-column: 1; grid-row: 2;
    min-height: 50vh;
  }
  .items-zone {
    grid-column: 1; grid-row: 3;
    display: flex; flex-wrap: wrap;
    gap: 6px; padding: 10px 8px;
    align-content: flex-start;
    justify-content: center;
    background: rgba(20,15,10,.5);
    border-top: 1px solid rgba(220,180,60,.2);
    max-height: 38vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .items-zone::-webkit-scrollbar { height: 3px; width: 3px; }
  .items-zone::-webkit-scrollbar-thumb { background: rgba(220,180,60,.3); border-radius: 2px; }

  /* Items: drop absolute positioning, equalize size, no rotation */
  .scatter-item {
    position: relative !important;
    left: auto !important; top: auto !important;
    width: 78px !important;
    transform: none !important;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    min-height: 78px;
  }
  .scatter-item img {

  }
  /* tooltip awkward on touch — hide */
  .item-tooltip { display: none; }

  /* Saints panel: fixed overlay drawer from right */
  .saints-panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(320px, 86vw);
    grid-column: unset; grid-row: unset;
    z-index: 100;
    transform: translateX(100%);
    transition: transform .3s cubic-bezier(.4,0,.2,1);

  .saints-panel-header {

}

/* very narrow phones (< 380px) — further compact */

  'key':            { l:13,  t:39,  w:124, r:8   },

  'outfit-disciple':{ l:55,  t:54,  w:160, r:0   },
  'outfit-1444':    { l:76,  t:54,  w:160, r:0   },
};

/* ── Saints ── */
const SAINTS = [
  { id:'christ-baptism', name:'예수 (세례)',      latin:'Baptismus Christi',
    required:['hair-long','beard-short','pigeon'],
    forbid:['outfit-monk','outfit-red','outfit-disciple','outfit-mary','outfit-1444','beard','hat'],
    attrs:['긴 머리','수염','비둘기 (성령)'],
    story:'세례자 요한에게 요르단강에서 세례받는 그리스도. 하늘이 열리고 성령이 비둘기 형상으로 강림한다.',
    image:'./Assets/saint-baptism.jpeg', galleryImg:'./Assets/saint-baptism.jpeg' },
  { id:'john-baptist',   name:'세례자 요한',      latin:'S. Ioannes Baptista',
    required:['outfit-red','staff'],
    attrs:['붉은 망토','십자가 지팡이'],

    story:'그리스도의 어머니. 파란 망토는 하늘·천상의 여왕을, 안쪽 붉은 옷은 수난에 함께함을 상징한다.',
    image:'./Assets/saint-mary.jpeg', galleryImg:'./Assets/saint-mary.jpeg' },
  { id:'moses',          name:'모세',             latin:'Moyses',
    required:['outfit-disciple','beard','commandment'],
    attrs:['흰 수염','십계명 석판'],
    story:'시나이산에서 야훼로부터 십계명을 받은 선지자. 구약의 가장 중요한 인물.',
    image:'./Assets/saint-moses.jpeg', galleryImg:'./Assets/saint-moses.jpeg' },
  { id:'jerome',         name:'성 히에로니무스',  latin:'S. Hieronymus',
    required:['outfit-red','beard','hat'],
    attrs:['추기경 모자','흰 수염','불가타 성경'],
    story:'히브리·그리스 성경을 라틴어로 번역해 불가타 성경을 완성한 4세기 교부.',
    image:'./Assets/saint-peter.jpeg', galleryImg:'./Assets/saint-peter.jpeg' },
  { id:'francis',        name:'성 프란치스코',    latin:'S. Franciscus',
    required:['outfit-monk','hair-monk'],
    forbid:['beard','hat'],
    attrs:['갈색 수도복','tonsure 삭발'],
    story:'모든 것을 버리고 청빈의 삶을 택한 13세기 수도자. 프란치스코회의 창립자.',
    image:'./Assets/saint-francis.jpeg', galleryImg:'./Assets/saint-francis.jpeg' },
  { id:'veronica',       name:'성 베로니카',      latin:'S. Veronica',
    required:['outfit-disciple','sudarium','hair-long'],
    forbid:['beard'],
    attrs:['수다리움 (성안포)','여성 의상'],
    story:'갈보리 언덕의 그리스도 얼굴을 천으로 닦아드린 여인. 그 천에 얼굴이 기적적으로 새겨졌다.',

  { id:'peter',          name:'성 베드로',         latin:'S. Petrus',
    required:['key','outfit-disciple','beard'],
    forbid:['commandment'],
    attrs:['열쇠 (천국의 문)','제자 의상','수염'],
    story:'예수의 수제자이자 교회의 반석. 천국의 열쇠를 받은 첫 번째 교황. 십자가에 거꾸로 매달려 순교했다.',
    image:'./Assets/saint-peter.jpeg', galleryImg:'./Assets/saint-peter.jpeg' },
];

/* ── State ── */
const state = {
  placed:     {},
  discovered: new Set(),
  dev:        new URLSearchParams(location.search).has('dev'),
};

const COORDS_KEY = 'medieval-saints-game:coords';
try {
  const saved = JSON.parse(localStorage.getItem(COORDS_KEY) || '{}');
  Object.entries(saved).forEach(([id, c]) => {
    const it = ITEMS.find(i => i.id === id);
    if (it && c && typeof c.x === 'number') {
      it.x = c.x; it.y = c.y;
      if (typeof c.scale === 'number') it.scale = c.scale;
    }
  });
} catch(e) {}

/* ── Screen transitions ── */
document.getElementById('start-btn').addEventListener('click', () => {
  const t = document.getElementById('screen-title');
  const g = document.getElementById('screen-game');
  t.style.transition = 'opacity .4s';
  t.style.opacity = '0';
  setTimeout(() => {
    t.classList.remove('active');
    t.style.opacity = '';
    g.classList.add('active');
    fitStage();
  }, 400);
});

document.getElementById('back-btn').addEventListener('click', () => {
  const has = Object.keys(state.placed).length || state.discovered.size;
  if (has && !confirm('처음으로 돌아가시겠어요? 진행이 초기화됩니다.')) return;
  resetAll();
  document.getElementById('screen-game').classList.remove('active');
  document.getElementById('screen-title').classList.add('active');
});

function resetAll() {
  state.placed = {};
  state.discovered.clear();
  renderLayers();
  renderScatter();
  renderSaintsPanel();
  updateHud();
}

/* ── Scatter render ── */
const itemsZone = document.getElementById('items-zone');

function renderScatter() {
  itemsZone.innerHTML = '';
  ITEMS.forEach(item => {
    const s = SCATTER[item.id];
    if (!s) return;
    const el = document.createElement('div');
    const tooltipDir = s.t < 22 ? ' tooltip-down' : '';
    el.className = 'scatter-item' + (state.placed[item.id] ? ' placed' : '') + tooltipDir;
    el.dataset.itemId = item.id;
    el.style.cssText = `left:${s.l}%; top:${s.t}%; width:${s.w}px; transform:rotate(${s.r}deg);`;
    el.draggable = true;

    const img = document.createElement('img');
    img.src = item.src; img.alt = item.name;
    img.style.width = '100%';
    el.appendChild(img);

    // tooltip
    const tip = document.createElement('div');
    tip.className = 'item-tooltip';
    tip.textContent = item.name;
    el.appendChild(tip);

    el.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', item.id);
      e.dataTransfer.effectAllowed = 'copy';
    });
    el.addEventListener('click', () => {
      if (state.placed[item.id]) {
        removeLayer(item.id);   // click again → undress
      } else {
        place(item.id);         // click → dress
      }
    });

    itemsZone.appendChild(el);
  });
}

function refreshScatterItem(itemId) {
  const el = itemsZone.querySelector(`[data-item-id="${itemId}"]`);
  if (el) el.classList.toggle('placed', !!state.placed[itemId]);
}

/* ── Mannequin drop zone ── */
const mannequinZone = document.getElementById('mannequin-zone');
const stage         = document.getElementById('stage');

mannequinZone.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  mannequinZone.classList.add('drop-over');
});
mannequinZone.addEventListener('dragleave', e => {
  if (!mannequinZone.contains(e.relatedTarget))
    mannequinZone.classList.remove('drop-over');
});
mannequinZone.addEventListener('drop', e => {
  e.preventDefault();
  mannequinZone.classList.remove('drop-over');
  const id = e.dataTransfer.getData('text/plain');
  if (id) place(id);
});

/* ── Place / Remove ── */
function place(itemId) {
  const item = ITEMS.find(i => i.id === itemId);
  if (!item) return;
  // one outfit
  if (item.category === '의상') {
    Object.keys(state.placed).forEach(oid => {
      const o = ITEMS.find(i => i.id === oid);
      if (o && o.category === '의상' && o.id !== item.id) removeLayer(o.id);
    });
  }
  // one hair base
  if (item.id === 'hair-monk' || item.id === 'hair-long') {
    ['hair-monk','hair-long'].forEach(h => { if (h !== item.id) removeLayer(h); });
  }
  state.placed[item.id] = { x: item.x, y: item.y, scale: item.scale };
  renderLayers(item.id);
  refreshScatterItem(item.id);
  checkSaint();
}

function removeLayer(itemId) {
  delete state.placed[itemId];
  stage.querySelector(`.placed-layer[data-item-id="${itemId}"]`)?.remove();
  refreshScatterItem(itemId);
}

function renderLayers(flashId) {
  stage.querySelectorAll('.placed-layer').forEach(n => n.remove());
  Object.entries(state.placed).forEach(([id, pos]) => {
    const item = ITEMS.find(i => i.id === id);
    if (!item) return;
    const el = document.createElement('div');
    el.className = 'placed-layer' + (id === flashId ? ' just-placed' : '');
    el.dataset.itemId = id;
    const sc = pos.scale ?? item.scale ?? 1;
    const w = item.w * sc, h = item.h * sc;
    el.style.cssText = `left:${pos.x}px; top:${pos.y+MANNEQUIN_TOP}px; width:${w}px; height:${h}px; z-index:${item.z};`;
    el.innerHTML = `<img src="${item.src}" alt="" style="width:100%;height:100%;object-fit:contain;">`;

    // click to remove (non-dev mode)
    if (!state.dev) {
      el.addEventListener('click', () => {
        removeLayer(id);
      });
    }

    if (state.dev) { el.classList.add('dev-draggable'); enableDevDrag(el, id); }
    stage.appendChild(el);
  });
}

/* ── Saint check ── */
function checkSaint() {
  const placed = new Set(Object.keys(state.placed));
  for (const saint of SAINTS) {
    if (state.discovered.has(saint.id)) continue;
    const ok = saint.required.every(r => placed.has(r))
      && !(saint.forbid || []).some(f => placed.has(f));
    if (ok) {
      state.discovered.add(saint.id);
      showModal(saint);
      revealSaintCard(saint.id);
      updateHud();
      return;
    }
  }
}

/* ── Saints panel ── */
const saintsList = document.getElementById('saints-list');

function renderSaintsPanel() {
  saintsList.innerHTML = '';
  SAINTS.forEach(saint => {
    const isDisco = state.discovered.has(saint.id);
    const card = document.createElement('div');
    card.className = 'saint-card ' + (isDisco ? 'discovered' : 'undiscovered');
    card.dataset.saintId = saint.id;

    const imgBox = document.createElement('div');
    imgBox.className = 'saint-card-img';
    const img = document.createElement('img');
    img.src = saint.galleryImg; img.alt = saint.name;
    imgBox.appendChild(img);

    const info = document.createElement('div');
    info.className = 'saint-card-info';

    const nameEl = document.createElement('div');
    nameEl.className = 'saint-card-name';
    nameEl.textContent = isDisco ? saint.name : '???';
    info.appendChild(nameEl);

    if (isDisco) {
      const latinEl = document.createElement('div');
      latinEl.className = 'saint-card-latin';
      latinEl.textContent = saint.latin;
      info.appendChild(latinEl);

      const attrsEl = document.createElement('div');
      attrsEl.className = 'saint-card-attrs';
      saint.attrs.forEach(a => {
        const chip = document.createElement('span');
        chip.className = 'saint-card-chip'; chip.textContent = a;
        attrsEl.appendChild(chip);
      });
      info.appendChild(attrsEl);

      card.addEventListener('click', () => showModal(saint));
    }

    card.appendChild(imgBox);
    card.appendChild(info);
    saintsList.appendChild(card);
  });

  document.getElementById('panel-found').textContent = state.discovered.size;
}

function revealSaintCard(saintId) {
  const saint = SAINTS.find(s => s.id === saintId);
  const card = saintsList.querySelector(`[data-saint-id="${saintId}"]`);
  if (!card || !saint) return;

  card.classList.remove('undiscovered');
  card.classList.add('discovered', 'just-found');
  card.querySelector('.saint-card-name').textContent = saint.name;

  // add latin
  const latinEl = document.createElement('div');
  latinEl.className = 'saint-card-latin'; latinEl.textContent = saint.latin;
  card.querySelector('.saint-card-info').appendChild(latinEl);

  // add attrs
  const attrsEl = document.createElement('div');
  attrsEl.className = 'saint-card-attrs';
  saint.attrs.forEach(a => {
    const chip = document.createElement('span');
    chip.className = 'saint-card-chip'; chip.textContent = a;
    attrsEl.appendChild(chip);
  });
  card.querySelector('.saint-card-info').appendChild(attrsEl);

  card.addEventListener('click', () => showModal(saint));
  setTimeout(() => card.classList.remove('just-found'), 700);

  document.getElementById('panel-found').textContent = state.discovered.size;
}

/* ── HUD ── */
function updateHud() {
  document.getElementById('hud-count').textContent = `${state.discovered.size} / ${SAINTS.length} 발견`;
}

/* ── Modal ── */
const modalBack = document.getElementById('modal-back');
function closeModal() {
  modalBack.classList.remove('open');
  if (state.discovered.size === SAINTS.length) {
    setTimeout(showComplete, 350);
  }
}
document.getElementById('modal-close').addEventListener('click', closeModal);
modalBack.addEventListener('click', e => { if (e.target === modalBack) closeModal(); });

function showComplete() {
  document.getElementById('complete-sub').textContent =
    `${SAINTS.length}인의 성인이 모두 완성되었습니다`;
  const grid = document.getElementById('complete-grid');
  grid.innerHTML = SAINTS.map(s =>
    `<span class="complete-chip">${s.name}</span>`).join('');

  const container = document.getElementById('complete-particles');
  container.innerHTML = '';
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'complete-particle';
    const size = 4 + Math.random() * 7;
    p.style.cssText = `left:${Math.random()*100}%;bottom:${-size}px;width:${size}px;height:${size}px;`;
    p.style.setProperty('--dur', (2.5 + Math.random() * 3.5) + 's');
    p.style.setProperty('--del',  (Math.random() * 2.5) + 's');
    container.appendChild(p);
  }
  document.getElementById('screen-complete').classList.add('open');
}

document.getElementById('complete-replay').addEventListener('click', () => {
  document.getElementById('screen-complete').classList.remove('open');
  resetAll();
});
document.getElementById('complete-home').addEventListener('click', () => {
  document.getElementById('screen-complete').classList.remove('open');
  resetAll();
  document.getElementById('screen-game').classList.remove('active');
  document.getElementById('screen-title').classList.add('active');
});

function showModal(saint) {
  document.getElementById('modal-name').textContent  = saint.name;
  document.getElementById('modal-latin').textContent = saint.latin;
  document.getElementById('modal-img').src           = saint.image;
  document.getElementById('modal-attrs').innerHTML   = saint.attrs.map(a => `<span class="modal-chip">${a}</span>`).join('');
  document.getElementById('modal-story').textContent = saint.story;
  modalBack.classList.add('open');
}

/* ── Controls ── */
document.getElementById('reset-btn').addEventListener('click', () => {
  state.placed = {};
  renderLayers();
  renderScatter();
});
document.getElementById('undress-btn').addEventListener('click', () => {
  Object.keys(state.placed).forEach(id => {
    if (ITEMS.find(i => i.id === id)?.category === '의상') removeLayer(id);
  });
  renderScatter();
});

/* ── Mobile saints panel drawer ── */
const saintsPanelEl    = document.getElementById('saints-panel');
const saintsBackdropEl = document.getElementById('saints-backdrop');
function openSaints()  { saintsPanelEl.classList.add('open');    saintsBackdropEl.classList.add('open'); }
function closeSaints() { saintsPanelEl.classList.remove('open'); saintsBackdropEl.classList.remove('open'); }
document.getElementById('saints-toggle').addEventListener('click', openSaints);
document.getElementById('saints-close' ).addEventListener('click', closeSaints);
saintsBackdropEl.addEventListener('click', closeSaints);
/* close drawer when window grows past mobile breakpoint */
window.addEventListener('resize', () => {
  if (window.innerWidth > 900) closeSaints();
});

/* ── Stage scale ── */
function fitStage() {
  const zone   = mannequinZone;
  const availH = zone.clientHeight;
  const availW = zone.clientWidth;
  const stageW = 376;
  const stageH = 971 + MANNEQUIN_TOP;
  const scale  = Math.min(1, availH / stageH, availW / stageW);
  const left   = Math.max(0, (availW - stageW * scale) / 2);
  const top    = Math.max(0, (availH - stageH * scale) / 2);
  stage.style.left      = `${left}px`;
  stage.style.top       = `${top}px`;
  stage.style.height    = `${stageH}px`;
  stage.style.transform = `scale(${scale})`;
  stage.style.marginBottom = '0';
}
window.addEventListener('resize', fitStage);

/* ── Dev mode ── */
let activeDevItem = null;

function enableDevDrag(el, itemId) {
  let startX, startY, origX, origY;
  el.addEventListener('mousedown', e => {
    e.preventDefault();
    activeDevItem = itemId;
    const sf = stage.getBoundingClientRect().width / 376;
    startX = e.clientX; startY = e.clientY;
    origX  = state.placed[itemId].x; origY = state.placed[itemId].y;
    const onMove = ev => {
      state.placed[itemId].x = Math.round(origX + (ev.clientX - startX) / sf);
      state.placed[itemId].y = Math.round(origY + (ev.clientY - startY) / sf);
      el.style.left = state.placed[itemId].x + 'px';
      el.style.top  = (state.placed[itemId].y + MANNEQUIN_TOP) + 'px';
      updateDevHud(itemId);
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
  el.addEventListener('wheel', e => {
    e.preventDefault(); activeDevItem = itemId;
    resizeItem(itemId, e.deltaY < 0 ? 1 : -1, e.shiftKey ? 5 : 1);
  }, { passive: false });
  el.addEventListener('mouseenter', () => { activeDevItem = itemId; updateDevHud(itemId); });
}

function resizeItem(itemId, dir, mult = 1) {
  const item = ITEMS.find(i => i.id === itemId);
  const pos  = state.placed[itemId];
  if (!item || !pos) return;
  const oldS = pos.scale ?? item.scale ?? 1;
  const newS = Math.max(0.1, Math.min(3, oldS + dir * 0.02 * mult));
  const [ow,oh,nw,nh] = [item.w*oldS, item.h*oldS, item.w*newS, item.h*newS];
  pos.x = Math.round(pos.x + (ow-nw)/2);
  pos.y = Math.round(pos.y + (oh-nh)/2);
  pos.scale = newS;
  const el = stage.querySelector(`.placed-layer[data-item-id="${itemId}"]`);
  if (el) {
    el.style.left = pos.x + 'px';
    el.style.top  = (pos.y + MANNEQUIN_TOP) + 'px';
    el.style.width  = nw + 'px';
    el.style.height = nh + 'px';
  }
  updateDevHud(itemId);
}

const devHud = document.getElementById('dev-hud');
const devCoords = document.getElementById('dev-coords');
function updateDevHud(hi) {
  if (!state.dev) return;
  const lines = Object.entries(state.placed).map(([id, pos]) => {
    const it = ITEMS.find(i => i.id === id);
    const sc = (pos.scale ?? it.scale ?? 1).toFixed(2);
    return `${id===hi?'▶ ':'  '}${id}: x=${pos.x} y=${pos.y} <span style="color:#e8c96a">×${sc}</span>`;
  });
  devCoords.innerHTML = lines.join('<br>') || '<span style="opacity:.4">아이템을 올려놓으세요</span>';
}
if (state.dev) {
  devHud.classList.add('open');
  document.addEventListener('keydown', e => {
    if ((e.key==='s'||e.key==='S') && state.dev) {
      const coords = {};
      Object.entries(state.placed).forEach(([id, pos]) => {
        const it = ITEMS.find(i => i.id === id);
        coords[id] = { x: pos.x, y: pos.y, scale: pos.scale ?? it.scale };
      });
      localStorage.setItem(COORDS_KEY, JSON.stringify(coords));
      flashHud('💾 저장됨');
    }
    if ((e.key==='d'||e.key==='D') && state.dev) {
      const dump = {};
      ITEMS.forEach(it => {
        const cur = state.placed[it.id];
        dump[it.id] = cur ? { x:cur.x, y:cur.y, scale:+(( cur.scale??it.scale).toFixed(3)) }
                          : { x:it.x,  y:it.y,  scale:it.scale };
      });
      console.log(JSON.stringify(dump, null, 2));
      console.table(dump);
      flashHud('📋 dump');
    }
    if ((e.key==='r'||e.key==='R') && state.dev) {
      if (confirm('좌표 초기화?')) { localStorage.removeItem(COORDS_KEY); location.reload(); }
    }
    if (['[',']','-','='].includes(e.key) && activeDevItem) {
      e.preventDefault();
      resizeItem(activeDevItem, (e.key===']'||e.key==='=') ? 1 : -1, e.shiftKey ? 5 : 1);
    }
  });
}
function flashHud(msg) {
  const orig = devCoords.innerHTML;
  devCoords.innerHTML = `<strong>${msg}</strong>`;
  setTimeout(() => devCoords.innerHTML = orig, 900);
}

/* ── Init ── */
document.getElementById('panel-total').textContent = SAINTS.length;
renderScatter();
renderSaintsPanel();
updateHud();
</script>
